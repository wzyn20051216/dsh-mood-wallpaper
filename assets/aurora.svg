<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b1f"/>
      <stop offset="0.6" stop-color="#0a1833"/>
      <stop offset="1" stop-color="#0d2138"/>
    </linearGradient>
    <linearGradient id="band1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1dd9a3" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#1dd9a3" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7b6cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="band2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b6cff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b06cff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#38d6c0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="band3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38d6c0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4aa8ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#1dd9a3" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <g>
    <circle cx="180" cy="130" r="1.6" fill="#dbe7ff"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="70" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="160" r="1.8" fill="#dbe7ff"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1430" cy="90" r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0.25;0.8;0.25" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1760" cy="200" r="1.5" fill="#dbe7ff"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="260" r="1.1" fill="#ffffff"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="1180" cy="300" r="1.4" fill="#dbe7ff"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1600" cy="320" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="5.2s" repeatCount="indefinite"/></circle>
  </g>
  <g filter="url(#soft)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;-90,60;70,-40;0,0" dur="30s" repeatCount="indefinite"/>
      <path d="M-240 760 C 320 560, 760 700, 1180 590 C 1540 500, 1900 620, 2140 540 L 2140 1160 L -240 1160 Z" fill="url(#band1)">
        <animate attributeName="opacity" values="0.75;1;0.75" dur="10s" repeatCount="indefinite"/>
      </path>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;80,-50;-60,60;0,0" dur="36s" repeatCount="indefinite"/>
      <path d="M-260 860 C 340 700, 840 800, 1260 690 C 1600 610, 1960 720, 2160 640 L 2160 1180 L -260 1180 Z" fill="url(#band2)">
        <animate attributeName="opacity" values="0.6;0.95;0.6" dur="12s" repeatCount="indefinite"/>
      </path>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;-70,-40;90,50;0,0" dur="42s" repeatCount="indefinite"/>
      <path d="M-280 640 C 300 480, 780 560, 1220 480 C 1580 410, 1980 500, 2180 440 L 2180 1140 L -280 1140 Z" fill="url(#band3)">
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="14s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
