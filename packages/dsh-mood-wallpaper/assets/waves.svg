      <path d="M-200 620 Q 160 700 520 620 T 1240 620 T 1960 620 T 2680 620" fill="none" stroke="url(#w2)" stroke-width="4" stroke-linecap="round">
        <animate attributeName="opacity" values="0.65;0.95;0.65" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>
    <g>
